<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SKY COT">
<meta name="theme-color" content="#0d3b6e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>SKY BLUE - Cotizaciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#eef2f7;color:#1e293b;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
:root{--N:#0d3b6e;--T:#2ab7a9;--L:#e2e8f0}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
#_bar{background:var(--N);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:40;flex-shrink:0}
#_cont{flex:1;overflow-y:auto;padding-bottom:70px}
#_bnav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--L);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom,0)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 6px;border:none;background:none;cursor:pointer;color:#94a3b8}
.ntab.on{color:var(--T)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;border:none;font-size:13px}
.btn:active,.btn2:active{opacity:.75}
.bp{background:#2ab7a9;color:white}
.bn{background:#0d3b6e;color:white}
.bg{background:white;color:#334155;border:1px solid var(--L)}
.bv{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
.bb{background:#eff6ff;color:#3b82f6;border:1px solid #bfdbfe}
.bf{width:100%;margin-bottom:8px;display:flex}
.chip{display:inline-flex;align-items:center;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap}
.ct{background:#ccfbf1;color:#0f766e}
.cg{background:#d1fae5;color:#059669}
.cs{background:#f1f5f9;color:#475569}
.cb{background:#eff6ff;color:#3b82f6}
.cn{background:#dbeafe;color:#0d3b6e}
@media print{
  #_bar,#_bnav,#_modal,.np{display:none!important}
  body{background:white}
  #_cont{padding-bottom:0!important;overflow:visible}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{margin:7mm;size:A4 portrait}
}
#_ibanner{display:none;position:fixed;bottom:72px;left:12px;right:12px;z-index:90;background:#0d3b6e;color:white;border-radius:14px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.3);flex-direction:column;gap:8px}
#_offbar{display:none;position:fixed;top:52px;left:0;right:0;z-index:89;background:#f59e0b;color:white;text-align:center;font-size:12px;font-weight:600;padding:6px}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;min-height:100vh">
  <div id="_bar">
    <div style="display:flex;align-items:center;gap:10px">
      <img id="_tlogo" style="height:26px;filter:brightness(0) invert(1)" alt="SKY">
      <div style="width:1px;height:18px;background:rgba(255,255,255,.2)"></div>
      <span style="font-size:10px;color:rgba(255,255,255,.6);letter-spacing:2px;text-transform:uppercase;font-weight:600">Cotizaciones</span>
    </div>
    <nav id="_tnav" style="display:flex;gap:3px"></nav>
    <select id="_usel" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:12px;border-radius:8px;padding:5px 10px;outline:none;max-width:170px"></select>
  </div>
  <div id="_offbar">&#x1F4E1; Sin internet &mdash; IA desactivada</div>
  <div id="_cont"></div>
  <div id="_bnav"></div>
</div>
<div id="_modal"></div>
<div id="_ibanner">
  <div style="display:flex;align-items:center;gap:10px">
    <img src="/icon-192.png" style="width:40px;height:40px;border-radius:10px" onerror="this.style.display='none'">
    <div style="flex:1"><div style="font-weight:700;font-size:13px">Instalar SKY BLUE</div><div style="font-size:11px;opacity:.8">Agregar a pantalla de inicio</div></div>
  </div>
  <div style="display:flex;gap:8px">
    <button id="_installBtn" style="flex:1;background:#2ab7a9;color:white;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:13px;cursor:pointer">&#x1F4F2; Instalar</button>
    <button id="_dismissBtn" style="background:rgba(255,255,255,.15);color:white;border:none;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer">Ahora no</button>
  </div>
</div>
<script src="/assets.js"></script>
<script src="/app.js"></script>
</body>
</html>
